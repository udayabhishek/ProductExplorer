name: ProductExplorer CD

on:
  workflow_dispatch:

jobs:
  archive:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive
        run: |
          xcodebuild \
            -project ProductExplorer.xcodeproj \
            -scheme ProductExplorer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/ProductExplorer.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ProductExplorer-Archive
          path: build/ProductExplorer.xcarchive
          if-no-files-found: error
