name: ProductExplorer CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          xcodebuild \
            -project ProductExplorer.xcodeproj \
            -scheme ProductExplorer \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.1' \
            test