name: ProductExplorer CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build
        run: |
          xcodebuild \
            -project ProductExplorer.xcodeproj \
            -scheme ProductExplorer \
            -sdk iphonesimulator \
            -configuration Debug \
            build

      - name: Test
        run: |
          xcodebuild \
            -project ProductExplorer.xcodeproj \
            -scheme ProductExplorer \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17 \
            test
